services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kostak
      POSTGRES_USER: kostak
      POSTGRES_PASSWORD: kostak
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kostak -d kostak"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - kostak_pg:/var/lib/postgresql/data

volumes:
  kostak_pg:

