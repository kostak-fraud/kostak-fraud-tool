services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kostak}
      POSTGRES_USER: ${POSTGRES_USER:-kostak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kostak-local-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - kostak-postgres-data:/var/lib/postgresql

  migrate:
    profiles: ["runtime"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &runtime-environment
      APP_MODE: migrate
      APP_ENV: local
      APP_RELEASE_SHA: local-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kostak}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kostak}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kostak-local-only}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["runtime"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *runtime-environment
      APP_MODE: api
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      SERVER_PORT: 8080
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    profiles: ["runtime"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *runtime-environment
      APP_MODE: worker
      SPRING_FLYWAY_ENABLED: "false"
      APP_WORKER_HEARTBEAT_INTERVAL: 5s
      APP_WORKER_HEARTBEAT_FILE: /tmp/kostak-worker-heartbeat
      APP_WORKER_HEARTBEAT_MAX_AGE_SECONDS: "20"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  kostak-postgres-data:
