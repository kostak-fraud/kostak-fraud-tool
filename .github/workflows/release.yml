name: Manual Release Recovery

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA from main; release remains blocked until the Railway release flow is verified
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  manual-release:
    name: manual-release
    if: >-
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      RELEASE_BRANCH: main
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::RELEASE_SHA must be a full lowercase commit SHA."
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::The checked-out commit does not match RELEASE_SHA."
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main is unavailable for manual release verification."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::Manual releases must use a commit contained in origin/main."
            exit 1
          fi

      - name: Test release gate helpers
        run: node --test scripts/release/*.test.mjs

      - name: Fail closed until Railway production release is configured
        shell: bash
        run: |
          echo "::error::Manual production release is intentionally blocked until Railway production services, migration sequencing, and live smoke evidence are configured and verified."
          exit 1
