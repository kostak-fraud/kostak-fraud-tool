spring:
  application:
    name: kostak-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/kostak}
    username: ${SPRING_DATASOURCE_USERNAME:kostak}
    password: ${SPRING_DATASOURCE_PASSWORD:kostak-local-only}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:4}
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
      schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
  flyway:
    enabled: false
    clean-disabled: true
    validate-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  environment: ${APP_ENV:local}
  release-sha: ${APP_RELEASE_SHA:local-development}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  auth:
    jwks-url: ${SUPABASE_JWKS_URL:https://example.invalid/auth/v1/.well-known/jwks.json}
    issuer: ${SUPABASE_JWT_ISSUER:https://example.invalid/auth/v1}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  simulation:
    enabled: ${APP_SIMULATION_ENABLED:false}
    poll-interval: ${APP_SIMULATION_POLL_INTERVAL:1s}
  worker:
    heartbeat-interval: ${APP_WORKER_HEARTBEAT_INTERVAL:30s}
    heartbeat-file: ${APP_WORKER_HEARTBEAT_FILE:/tmp/kostak-worker-heartbeat}
    heartbeat-max-age-seconds: ${APP_WORKER_HEARTBEAT_MAX_AGE_SECONDS:90}
    shutdown-timeout: ${APP_WORKER_SHUTDOWN_TIMEOUT:10s}

info:
  app:
    release:
      sha: ${app.release-sha}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
